name: SAST Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run all tests with coverage
        run: npm test

      - name: SonarQube Scan
        shell: powershell
        run: |
          npx sonar-scanner "-Dsonar.projectKey=Secure-web-with-user-authentication" "-Dsonar.sources=backend,frontend" "-Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,backend/coverage/**,frontend/coverage/**" "-Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info" "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}" "-Dsonar.login=${{ secrets.SONAR_TOKEN }}"